<style>
:root{

<script>
var EDS=[["locais","Notícias locais"],["politica","Política"],["dinheiro","Dinheiro"],["negocios","Negócios"],["esportes","Esportes"],["turismo","Turismo"],["entretenimento","Entretenimento"],["cultura","Cultura"]];
var rows=[], ads=[];
var $=function(i){return document.getElementById(i)};
var tabs=$("tabs"), view=$("view");

function esc(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function edName(id){for(var i=0;i<EDS.length;i++)if(EDS[i][0]===id)return EDS[i][1];return id}
function okUrl(u){return /^https?:\/\//i.test(u||"")}
function pic(r,c){return okUrl(r.f)?'<img class="ph '+(c||'')+'" src="'+esc(r.f)+'" alt="">':'<div class="ph '+(c||'')+'">Foto da matéria</div>'}

/* Lê query-string ?n= para links compartilhados (sem hash) */
function getQS(name){var m=location.search.match(new RegExp('[?&]'+name+'=([^&]*)'));return m?decodeURIComponent(m[1]):null;}
(function(){var qn=getQS('n');if(qn!==null){location.replace(location.pathname+'#/n/'+qn);}})();

/* URL limpa para compartilhamento (sem hash — WhatsApp reconhece como link) */
function shareUrl(idx){return location.protocol+'//'+location.host+location.pathname+'?n='+idx;}

function lead(r,i,tag){
  var href=okUrl(r.l)?'href="'+esc(r.l)+'" target="_blank" rel="noopener"':'href="#/n/'+i+'"';
  return '<a class="lead" '+href+'>'+pic(r)+'<h3>'+esc(r.t)+'</h3><span class="meta">'+(tag?'<span class="tag">'+tag+'</span> · ':'')+esc(edName(r.ed))+'</span><p>'+esc(r.r)+'</p><span class="meta">'+esc(r.a)+' · '+esc(r.h)+'</span></a>'
}
function item(r,i,sec){
  var href=okUrl(r.l)?'href="'+esc(r.l)+'" target="_blank" rel="noopener"':'href="#/n/'+i+'"';
  return '<li><a class="item" '+href+'><div class="tx">'+(sec?'<span class="sec">'+esc(edName(r.ed))+'</span>':'')+'<h4>'+esc(r.t)+'</h4>'+(sec?'':'<p>'+esc(r.r)+'</p>')+'<span class="meta">'+esc(r.h)+'</span></div>'+pic(r,"th")+'</a></li>'
}

function route(){
  var h=location.hash,m,sel="inicio",out="";
  if(m=h.match(/^#\/n\/(\d+)/)){
    var r=rows[+m[1]];
    if(r){
      sel=r.ed;
      var idx=+m[1];
      var ps=(r.x||r.r).split(/\n+/).map(function(p){return"<p>"+esc(p)+"</p>"}).join("");
      var artUrl=shareUrl(idx);                        /* ex: https://e-dolphin.info/?n=0 */
      var pageUrl=encodeURIComponent(artUrl);
      var pageTxt=encodeURIComponent(r.t);
      var shareBar='<div class="share-bar">'
        +'<span class="share-label">Compartilhar</span>'
        +('share' in navigator?'<button class="sh-btn sh-nat" onclick="doShare('+idx+')" title="Compartilhar">⬆</button>':'')
        /* WhatsApp: só a URL → gera card clicável (foto+título+desc) ao invés de texto solto */
        +'<a class="sh-btn sh-wa" href="https://wa.me/?text='+pageUrl+'" target="_blank" rel="noopener" title="WhatsApp">W</a>'
        +'<a class="sh-btn sh-fb" href="https://www.facebook.com/sharer/sharer.php?u='+pageUrl+'" target="_blank" rel="noopener" title="Facebook">f</a>'
        +'<a class="sh-btn sh-tw" href="https://twitter.com/intent/tweet?text='+pageTxt+'&url='+pageUrl+'" target="_blank" rel="noopener" title="X / Twitter">𝕏</a>'
        /* Telegram: só a URL → card clicável */
        +'<a class="sh-btn sh-tg" href="https://t.me/share/url?url='+pageUrl+'" target="_blank" rel="noopener" title="Telegram">✈</a>'
        +'<button class="sh-btn sh-cp" id="btn-cp" onclick="copyLink(this,\''+artUrl+'\')" title="Copiar link">🔗</button>'
        +'</div>';
      out='<article class="art"><button class="back" onclick="history.length>1?history.back():location.hash=\'#/\'">‹ Voltar</button>'+pic(r)+'<h1>'+esc(r.t)+'</h1><span class="meta"><span class="tag">'+esc(edName(r.ed))+'</span> · '+esc(r.a)+' · '+esc(r.h)+'</span>'+(r.x?'<p class="sum" style="margin-top:14px">'+esc(r.r)+'</p>':'')+'<div class="body" style="margin-top:16px">'+ps+'</div>'+shareBar+'<div class="ads-block" id="ads-art"><p class="ads-label">Publicidade</p><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6173105609015183" data-ad-slot="3333333333" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({})<\/script></div>'+'</article>';
      setOg(r,location.href);
    }
  }else if(m=h.match(/^#\/e\/(\w+)/)){
    sel=m[1];var ix=[];rows.forEach(function(r,i){if(r.ed===sel)ix.push(i)});
    out='<h2>'+esc(edName(sel))+'</h2>';
    if(!ix.length)out+='<p class="meta">Ainda não há notícias nesta editoria.</p>';
    else{out+=lead(rows[ix[0]],ix[0]);if(ix.length>1){out+='<ul class="list">';ix.slice(1).forEach(function(i){out+=item(rows[i],i)});out+='</ul>'}}
  }else if(rows.length){
    out=lead(rows[0],0,"Destaque")+'<div class="ads-block" id="ads-mid"><p class="ads-label">Publicidade</p><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6173105609015183" data-ad-slot="2222222222" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({})<\/script></div>'+'<h3 style="font:700 17px var(--head);margin:26px 0 0;color:var(--muted)">Nas editorias</h3><ul class="list">';
    var seen={};seen[rows[0].ed]=1;
    rows.forEach(function(r,i){if(i&&!seen[r.ed]){seen[r.ed]=1;out+=item(r,i,1)}});out+='</ul>';
  }else{
    out='<div class="loading"><div class="spinner"></div><span>Carregando…</span></div>';
  }
  view.innerHTML=out;
  window.scrollTo(0,0);
  var artTitle=null;
  var nm=location.hash.match(/^#\/n\/(\d+)/);
  if(nm){var rr=rows[+nm[1]];if(rr)artTitle=rr.t;}
  updateAd(sel,artTitle);
  [].forEach.call(tabs.children,function(b){var on=b.dataset.id===sel;b.setAttribute("aria-selected",on);if(on)b.scrollIntoView({inline:"center",block:"nearest"})});
}

/* Atualiza meta tags OG para a notícia atual */
function setOg(r,url){
  var img=r.f&&/^https?:\/\//i.test(r.f)?r.f:'https://e-dolphin.info/banner.svg';
  var setA=function(id,attr,val){var el=document.getElementById(id);if(el)el.setAttribute(attr,val)};
  setA('og-title','content',r.t);setA('og-desc','content',r.r);setA('og-image','content',img);setA('og-url','content',url);
  setA('tw-title','content',r.t);setA('tw-desc','content',r.r);setA('tw-image','content',img);
  document.title=r.t+' · 11hr Jornal da Zona Norte';
}

/* Compartilhamento */
function doShare(i){
  var r=rows[i];if(!r)return;
  var url=shareUrl(i);                              /* URL sem hash — funciona no WhatsApp */
  var shareBase={title:r.t,text:r.r,url:url};
  /* Tenta compartilhar com a foto da notícia */
  /* Tenta compartilhar com foto: envia arquivo + URL no texto */
  if(r.f&&/^https?:\/\//i.test(r.f)&&navigator.canShare){
    fetch(r.f)
      .then(function(res){return res.blob()})
      .then(function(blob){
        var ext=blob.type.includes('png')?'foto.png':'foto.jpg';
        var file=new File([blob],ext,{type:blob.type});
        /* URL vai no texto para garantir que aparece — campo url é ignorado pelo WhatsApp ao enviar arquivo */
        var withFile={title:r.t,text:r.r+'\n\n'+url,files:[file]};
        if(navigator.canShare(withFile)){return navigator.share(withFile);}
        return navigator.share(shareBase);
      })
      .catch(function(){navigator.share(shareBase).catch(function(){});});
  }else{
    navigator.share(shareBase).catch(function(){});
  }
}
function copyLink(btn,url){
  url=url||location.href;
  if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(function(){
      btn.textContent='✓';btn.classList.add('copied');
      setTimeout(function(){btn.textContent='🔗';btn.classList.remove('copied')},2000);
    });
  }else{
    var ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    btn.textContent='✓';btn.classList.add('copied');
    setTimeout(function(){btn.textContent='🔗';btn.classList.remove('copied')},2000);
  }
}

/* Anúncios: alvo="todas" → qualquer página, alvo=título → só naquela notícia */
function updateAd(section,articleTitle){
  if(!ads.length){$("ad-widget").classList.add("hidden-ad");return}
  var list;
  if(articleTitle){
    list=ads.filter(function(a){return(a.alvo||"todas").trim()===articleTitle});
    if(!list.length)list=ads.filter(function(a){return(a.alvo||"todas").trim()==="todas"});
  }else{
    list=ads.filter(function(a){return(a.alvo||"todas").trim()==="todas"});
  }
  if(!list.length){$("ad-widget").classList.add("hidden-ad");return}
  var ad=list[Math.floor(Math.random()*list.length)];
  if(okUrl(ad.foto)){
    $("ad-img").src=ad.foto;
    $("ad-link").href=okUrl(ad.link)?ad.link:"#";
    $("ad-widget").classList.remove("hidden-ad");
  }else{$("ad-widget").classList.add("hidden-ad")}
}

var adCol=false;
$("ad-toggle").onclick=function(){
  adCol=!adCol;
  var body=$("ad-body");
  if(adCol){body.style.maxHeight=body.scrollHeight+"px";setTimeout(function(){body.classList.add("collapsed")},10);$("ad-toggle").textContent="▲"}
  else{body.classList.remove("collapsed");body.style.maxHeight=body.scrollHeight+"px";$("ad-toggle").textContent="▼";setTimeout(function(){body.style.maxHeight=""},300)}
};

/* Tabs */
[["inicio","Início"]].concat(EDS).forEach(function(s){
  var b=document.createElement("button");b.className="tab";b.setAttribute("role","tab");b.dataset.id=s[0];b.textContent=s[1];
  b.onclick=function(){location.hash=s[0]==="inicio"?"#/":"#/e/"+s[0]};
  tabs.appendChild(b);
});
window.addEventListener("hashchange",route);

/* Oculta blocos de anuncio vazios */
function checkAds(){
  document.querySelectorAll('.ads-block').forEach(function(block){
    var ins=block.querySelector('ins.adsbygoogle');
    if(!ins)return;
    var loaded=ins.getAttribute('data-ad-status')=='filled'||ins.innerHTML.trim()!=='';
    block.style.display=loaded?'block':'none';
  });
}
setTimeout(checkAds,2500);

<style>
/* Chat widget — mesmo padrão do ad-widget, posicionado à ESQUERDA */
#chat-widget{
  position:fixed;
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  left:16px;
  z-index:40;
  width:300px;
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.38);
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--line);
  transition:transform .25s ease, opacity .25s ease;
}
#chat-widget.hidden-chat{
  transform:translateY(calc(100% + 20px));
  opacity:0;
  pointer-events:none;
}
#chat-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 12px;
  background:var(--mast);
  color:#fff;
  font:700 11px var(--head);
  letter-spacing:.04em;
  cursor:pointer;
  user-select:none;
}
#chat-toggle-btn{
  background:none;border:none;color:#fff;
  cursor:pointer;font:700 16px var(--head);
  line-height:1;padding:0;flex-shrink:0;
}
#chat-body{
  overflow:hidden;
  transition:max-height .3s ease;
  max-height:440px;
}
#chat-body.collapsed{max-height:0!important;}
#chat-iframe{
  width:100%;
  height:440px;
  border:none;
  display:block;
}
</style>

<div id="chat-widget" class="hidden-chat">
  <div id="chat-header" onclick="chatWidgetToggle()">
    <span>💬 CHAT DE CONVERSA</span>
    <button id="chat-toggle-btn" title="Recolher/Expandir">▼</button>
  </div>
  <div id="chat-body">
    <iframe id="chat-iframe" src="chat.html" title="Bate-papo da Zona Norte" loading="lazy"></iframe>
  </div>
</div>

<script>
(function(){
  var LSKEY  = '11hr_chat_widget_v1';
  var widget = document.getElementById('chat-widget');
  var cbody  = document.getElementById('chat-body');
  var ctog   = document.getElementById('chat-toggle-btn');
  var open   = true;

  /* Aparecer após 1.5 s (igual ao anúncio) */
  setTimeout(function(){ widget.classList.remove('hidden-chat'); }, 1500);

  /* Toggle do painel — seta sobe/desce */
  window.chatWidgetToggle = function(){
    open = !open;
    cbody.classList.toggle('collapsed', !open);
    ctog.textContent = open ? '▼' : '▲';
    localStorage.setItem(LSKEY, open ? 'open' : 'closed');
  };

  /* Restaurar estado */
  if(localStorage.getItem(LSKEY) === 'closed'){
    open = false;
    cbody.classList.add('collapsed');
    ctog.textContent = '▲';
  }
})();
</script>
