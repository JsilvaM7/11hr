<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>11hr Jornal da Zona Norte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6;--surface:#FFFFFF;--ink:#14213D;--muted:#5B6579;--line:#D9DEE8;
  --mast:#14213D;--accent:#FFC20E;--alert:#1A6B3A;--link:#1F3FBF;--ph1:#E3E8F2;--ph2:#D3DAE9;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Source Serif 4",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0F1E;--surface:#131A2E;--ink:#EEF1F8;--muted:#9AA5BC;--line:#26304A;--mast:#1B2A55;--link:#9DB2FF;--ph1:#1A2340;--ph2:#222D50;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A0F1E;--surface:#131A2E;--ink:#EEF1F8;--muted:#9AA5BC;--line:#26304A;--mast:#1B2A55;--link:#9DB2FF;--ph1:#1A2340;--ph2:#222D50;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--mast);z-index:30}
:root{--out:#5B7FA8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--out:#1A2A45}}
:root[data-theme="dark"]{--out:#1A2A45}
body{background:var(--out)}
.app{max-width:430px;margin:0 auto;background:var(--surface);min-height:100vh;box-shadow:0 0 0 1px var(--line),0 0 36px 10px rgba(10,20,50,.35)}
.mast{background:var(--mast);color:#fff;padding:18px 18px 14px}
.logo{display:flex;align-items:center;gap:12px}
.mark{font-family:var(--head);font-weight:800;font-size:54px;line-height:.8;letter-spacing:-.04em;background:var(--accent);color:#14213D;padding:10px 10px 8px;border-radius:6px;display:flex;align-items:baseline}
.mark small{font-size:22px;letter-spacing:0;margin-left:1px}
.name{font-family:var(--head);font-weight:700;font-size:22px;line-height:1.05}
.name span{display:block;font-weight:500;font-size:15px;opacity:.85;margin-top:3px}
.edition{display:flex;justify-content:space-between;gap:8px;margin-top:14px;font:500 13px var(--head);opacity:.9}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:4px;padding:8px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--muted);font:600 15px var(--head);padding:9px 13px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--mast);color:#fff}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{padding:18px 18px 80px}
h2{font:800 28px/1.1 var(--head);letter-spacing:-.02em;margin:0 0 16px}
.ph{aspect-ratio:16/9;border-radius:8px;background:repeating-linear-gradient(135deg,var(--ph1) 0 14px,var(--ph2) 14px 28px);display:flex;align-items:flex-end;padding:10px;font:500 12px var(--head);color:var(--muted)}
.lead h3{font:700 25px/1.15 var(--head);letter-spacing:-.01em;margin:14px 0 8px}
.lead p{font-size:18px;line-height:1.5;margin:0 0 8px}
.meta{font:500 13px var(--head);color:var(--muted)}
.tag{color:var(--alert);font-weight:700}
.list{margin:22px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.item{display:block;padding:16px 0;border-bottom:1px solid var(--line)}
.item h4{font:700 19px/1.25 var(--head);margin:0 0 6px}
.item p{font-size:16.5px;line-height:1.45;margin:0 0 6px;color:var(--ink)}
.sec{font:700 13px var(--head);color:var(--link)}
.foot{padding:18px;text-align:center;font:500 13px var(--head);color:var(--muted);border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.tab{transition:background .15s,color .15s}}
a.lead,a.item{color:inherit;text-decoration:none;display:block}
a.lead:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
img.ph{width:100%;object-fit:cover;display:block;padding:0}
.item{display:flex!important;gap:14px;align-items:flex-start}
.item .tx{flex:1;min-width:0}.item .th{flex:none;width:92px;height:92px;aspect-ratio:1;border-radius:8px;font-size:0;padding:0}
.back{border:0;background:none;color:var(--link);font:700 15px var(--head);padding:0 0 14px;cursor:pointer}
.art h1{font:800 29px/1.12 var(--head);letter-spacing:-.02em;margin:14px 0 10px}
.art .body p{font-size:19px;line-height:1.6;margin:0 0 16px}
.art .sum{font-size:20px;line-height:1.45;color:var(--muted);margin:0 0 14px}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 20px;color:var(--muted);font:600 15px var(--head)}
.spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--mast);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Anúncio flutuante */
#ad-widget{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;z-index:40;width:220px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.35);overflow:hidden;background:var(--surface);border:1px solid var(--line);transition:transform .25s ease,opacity .25s ease}
#ad-widget.hidden-ad{transform:translateY(calc(100% + 20px));opacity:0;pointer-events:none}
#ad-header{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--mast);color:#fff;font:700 11px var(--head);letter-spacing:.04em}
#ad-toggle{background:none;border:none;color:#fff;cursor:pointer;font:700 16px var(--head);line-height:1;padding:0}
#ad-body{overflow:hidden;transition:max-height .3s ease}
#ad-body.collapsed{max-height:0!important}
#ad-img{width:100%;display:block;cursor:pointer;object-fit:cover}
</style>
</head>
<body>
<div class="app">
  <header class="mast">
    <div class="logo">
      <div class="mark">11<small>hr</small></div>
      <div class="name">Jornal<span>da Zona Norte</span></div>
    </div>
    <div class="edition"><span id="date"></span><span>Edição das 11h</span></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Editorias"></nav>
  <main id="view" role="tabpanel"></main>
  <footer class="foot">11hr Jornal da Zona Norte</footer>
</div>

<!-- Anúncio flutuante -->
<div id="ad-widget" class="hidden-ad">
  <div id="ad-header">
    <span>PUBLICIDADE</span>
    <button id="ad-toggle" title="Recolher">▼</button>
  </div>
  <div id="ad-body">
    <a id="ad-link" href="#" target="_blank" rel="noopener">
      <img id="ad-img" src="" alt="Anúncio">
    </a>
  </div>
</div>

<script>
var EDS=[["locais","Notícias locais"],["politica","Política"],["dinheiro","Dinheiro"],["negocios","Negócios"],["esportes","Esportes"],["turismo","Turismo"],["entretenimento","Entretenimento"],["cultura","Cultura"]];
var rows=[], ads=[];
var $=function(i){return document.getElementById(i)};
var tabs=$("tabs"), view=$("view");

function esc(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function edName(id){for(var i=0;i<EDS.length;i++)if(EDS[i][0]===id)return EDS[i][1];return id}
function okUrl(u){return /^https?:\/\//i.test(u||"")}
function pic(r,c){return okUrl(r.f)?'<img class="ph '+(c||'')+'" src="'+esc(r.f)+'" alt="">':'<div class="ph '+(c||'')+'">Foto da matéria</div>'}

function lead(r,i,tag){
  var href=okUrl(r.l)?'href="'+esc(r.l)+'" target="_blank" rel="noopener"':'href="#/n/'+i+'"';
  return '<a class="lead" '+href+'>'+pic(r)+'<h3>'+esc(r.t)+'</h3><span class="meta">'+(tag?'<span class="tag">'+tag+'</span> · ':'')+esc(edName(r.ed))+'</span><p>'+esc(r.r)+'</p><span class="meta">'+esc(r.a)+' · '+esc(r.h)+'</span></a>'
}
function item(r,i,sec){
  var href=okUrl(r.l)?'href="'+esc(r.l)+'" target="_blank" rel="noopener"':'href="#/n/'+i+'"';
  return '<li><a class="item" '+href+'><div class="tx">'+(sec?'<span class="sec">'+esc(edName(r.ed))+'</span>':'')+'<h4>'+esc(r.t)+'</h4>'+(sec?'':'<p>'+esc(r.r)+'</p>')+'<span class="meta">'+esc(r.h)+'</span></div>'+pic(r,"th")+'</a></li>'
}

function route(){
  var h=location.hash,m,sel="inicio",out="";
  if(m=h.match(/^#\/n\/(\d+)/)){
    var r=rows[+m[1]];
    if(r){
      sel=r.ed;
      var ps=(r.x||r.r).split(/\n+/).map(function(p){return"<p>"+esc(p)+"</p>"}).join("");
      out='<article class="art"><button class="back" onclick="history.length>1?history.back():location.hash=\'#/\'">‹ Voltar</button>'+pic(r)+'<h1>'+esc(r.t)+'</h1><span class="meta"><span class="tag">'+esc(edName(r.ed))+'</span> · '+esc(r.a)+' · '+esc(r.h)+'</span>'+(r.x?'<p class="sum" style="margin-top:14px">'+esc(r.r)+'</p>':'')+'<div class="body" style="margin-top:16px">'+ps+'</div></article>';
    }
  }else if(m=h.match(/^#\/e\/(\w+)/)){
    sel=m[1];var ix=[];rows.forEach(function(r,i){if(r.ed===sel)ix.push(i)});
    out='<h2>'+esc(edName(sel))+'</h2>';
    if(!ix.length)out+='<p class="meta">Ainda não há notícias nesta editoria.</p>';
    else{out+=lead(rows[ix[0]],ix[0]);if(ix.length>1){out+='<ul class="list">';ix.slice(1).forEach(function(i){out+=item(rows[i],i)});out+='</ul>'}}
  }else if(rows.length){
    out=lead(rows[0],0,"Destaque")+'<h3 style="font:700 17px var(--head);margin:26px 0 0;color:var(--muted)">Nas editorias</h3><ul class="list">';
    var seen={};seen[rows[0].ed]=1;
    rows.forEach(function(r,i){if(i&&!seen[r.ed]){seen[r.ed]=1;out+=item(r,i,1)}});out+='</ul>';
  }else{
    out='<div class="loading"><div class="spinner"></div><span>Carregando…</span></div>';
  }
  view.innerHTML=out;
  window.scrollTo(0,0);
  var artTitle=null;
  var nm=location.hash.match(/^#\/n\/(\d+)/);
  if(nm){var rr=rows[+nm[1]];if(rr)artTitle=rr.t;}
  updateAd(sel,artTitle);
  [].forEach.call(tabs.children,function(b){var on=b.dataset.id===sel;b.setAttribute("aria-selected",on);if(on)b.scrollIntoView({inline:"center",block:"nearest"})});
}

/* Anúncios: alvo="todas" → qualquer página, alvo=título → só naquela notícia */
function updateAd(section,articleTitle){
  if(!ads.length){$("ad-widget").classList.add("hidden-ad");return}
  var list;
  if(articleTitle){
    list=ads.filter(function(a){return(a.alvo||"todas").trim()===articleTitle});
    if(!list.length)list=ads.filter(function(a){return(a.alvo||"todas").trim()==="todas"});
  }else{
    list=ads.filter(function(a){return(a.alvo||"todas").trim()==="todas"});
  }
  if(!list.length){$("ad-widget").classList.add("hidden-ad");return}
  var ad=list[Math.floor(Math.random()*list.length)];
  if(okUrl(ad.foto)){
    $("ad-img").src=ad.foto;
    $("ad-link").href=okUrl(ad.link)?ad.link:"#";
    $("ad-widget").classList.remove("hidden-ad");
  }else{$("ad-widget").classList.add("hidden-ad")}
}

var adCol=false;
$("ad-toggle").onclick=function(){
  adCol=!adCol;
  var body=$("ad-body");
  if(adCol){body.style.maxHeight=body.scrollHeight+"px";setTimeout(function(){body.classList.add("collapsed")},10);$("ad-toggle").textContent="▲"}
  else{body.classList.remove("collapsed");body.style.maxHeight=body.scrollHeight+"px";$("ad-toggle").textContent="▼";setTimeout(function(){body.style.maxHeight=""},300)}
};

/* Tabs */
[["inicio","Início"]].concat(EDS).forEach(function(s){
  var b=document.createElement("button");b.className="tab";b.setAttribute("role","tab");b.dataset.id=s[0];b.textContent=s[1];
  b.onclick=function(){location.hash=s[0]==="inicio"?"#/":"#/e/"+s[0]};
  tabs.appendChild(b);
});
window.addEventListener("hashchange",route);

/* Data */
var d=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
$("date").textContent=d.charAt(0).toUpperCase()+d.slice(1);

/* Carregar data.json */
view.innerHTML='<div class="loading"><div class="spinner"></div><span>Carregando…</span></div>';
fetch("data.json?v="+Date.now())
  .then(function(r){return r.ok?r.json():Promise.reject("Erro "+r.status)})
  .then(function(data){
    rows=(data.noticias||[]).map(function(n){return{ed:n.editoria||"locais",t:n.titulo||"",r:n.resumo||"",x:n.texto||"",f:n.foto||"",a:n.autor||"Redação 11hr",h:n.hora||"",l:n.link||""}});
    ads=(data.anuncios||[]).map(function(a){return{foto:a.foto||"",link:a.link||"",alvo:a.alvo||"todas"}});
    route();
  })
  .catch(function(e){
    view.innerHTML='<div class="loading"><span>⚠️ Erro ao carregar notícias.</span></div>';
    console.error(e);
  });
</script>
</body>
</html>
