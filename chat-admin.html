<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Chat</title>
<style>
:root{--mast:#14213D;--accent:#FFC20E;--red:#c62828;--green:#1a6b3a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:#f4f5f7;color:#1a1a1a;padding:16px}
h2{font-size:18px;color:var(--mast);margin-bottom:14px}
h3{font-size:14px;color:var(--mast);margin-bottom:10px}

/* STATS */
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.stat{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px 18px;flex:1;min-width:110px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;color:var(--mast)}
.stat small{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.04em}

/* TOOLBAR */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.toolbar select,.toolbar input{padding:7px 10px;border:1px solid #ccc;border-radius:7px;font:13px inherit}
.toolbar button{padding:7px 14px;border:none;border-radius:7px;font:700 12px inherit;cursor:pointer}
.btn-refresh{background:var(--mast);color:#fff}
.btn-refresh:hover{opacity:.85}

/* POST BOX */
.post-box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px;margin-bottom:16px}
.post-box select,.post-box textarea{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:7px;font:13px inherit;margin-bottom:8px}
.post-box textarea{resize:vertical;min-height:70px}
.post-box button{background:var(--mast);color:#fff;border:none;border-radius:7px;padding:9px 20px;font:700 13px inherit;cursor:pointer}
.post-box button:hover{opacity:.85}
#post-msg{font:600 12px inherit;color:var(--green);margin-left:8px}

/* MESSAGES TABLE */
.card{background:#fff;border:1px solid #ddd;border-radius:10px;margin-bottom:12px;overflow:hidden}
.card-head{background:var(--mast);color:#fff;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.card-head h4{font-size:13px;margin:0}
.card-head .badge{font-size:11px;opacity:.8}
.card-body{display:none;padding:0}
.card-body.open{display:block}

table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:#f0f2f7;padding:7px 10px;text-align:left;font-weight:700;color:#555;border-bottom:1px solid #e0e0e0;position:sticky;top:0}
tbody tr{border-bottom:1px solid #f0f0f0}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#fafafa}
td{padding:7px 10px;vertical-align:top}
td.td-msg{max-width:260px;word-break:break-word}
td.td-user{white-space:nowrap;font-weight:700;color:var(--mast)}
td.td-phone{white-space:nowrap;color:#555;font-family:monospace;font-size:11px}
td.td-time{white-space:nowrap;color:#888;font-size:11px}
td.td-actions{white-space:nowrap}
.btn-del{background:var(--red);color:#fff;border:none;border-radius:5px;padding:3px 8px;font:600 11px inherit;cursor:pointer;margin-right:4px}
.btn-del:hover{opacity:.8}
.btn-block{background:#e65100;color:#fff;border:none;border-radius:5px;padding:3px 8px;font:600 11px inherit;cursor:pointer}
.btn-block:hover{opacity:.8}
.tag-admin{background:var(--accent);color:var(--mast);font:700 9px inherit;padding:1px 5px;border-radius:99px;vertical-align:middle}

/* USERS TABLE */
.users-card{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden;margin-bottom:12px}
.users-card .card-head{cursor:pointer}
.users-body{display:none;padding:0}
.users-body.open{display:block}

/* BLOCKED */
.blocked-row{background:#fff3f3}
.unblock-btn{background:#388e3c;color:#fff;border:none;border-radius:5px;padding:3px 8px;font:600 11px inherit;cursor:pointer}

.empty{padding:20px;text-align:center;color:#999;font-size:13px}
.err{color:var(--red);font:600 13px inherit;padding:12px}
.loading{padding:20px;text-align:center;color:#888;font:500 13px inherit}
</style>
</head>
<body>

<h2>💬 Moderação do Bate-papo</h2>

<!-- Stats -->
<div class="stats">
  <div class="stat"><b id="st-msgs">—</b><small>Mensagens</small></div>
  <div class="stat"><b id="st-users">—</b><small>Usuários</small></div>
  <div class="stat"><b id="st-blocked">—</b><small>Bloqueados</small></div>
  <div class="stat"><b id="st-bairros">—</b><small>Bairros Ativos</small></div>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <select id="filter-bairro" onchange="applyFilter()">
    <option value="">— Todos os bairros —</option>
    <option>Santana</option><option>Tucuruvi</option><option>Vila Guilherme</option>
    <option>Parada Inglesa</option><option>Jardim São Paulo</option><option>Mandaqui</option>
    <option>Tremembé</option><option>Jaçanã</option><option>Casa Verde</option>
    <option>Freguesia do Ó</option><option>Brasilândia</option><option>Cachoeirinha</option>
    <option>Lauzane Paulista</option><option>Limão</option><option>Pirituba</option>
    <option>Jaraguá</option><option>São Domingos</option><option>Vila Maria</option>
    <option>Vila Medeiros</option><option>Imirim</option>
  </select>
  <input type="text" id="filter-user" placeholder="Filtrar por usuário…" oninput="applyFilter()">
  <button class="btn-refresh" onclick="loadData()">🔄 Atualizar</button>
</div>

<!-- Post as admin -->
<div class="post-box">
  <h3>📣 Postar como Admin</h3>
  <select id="post-bairro">
    <option value="">— Escolha o bairro —</option>
    <option>Santana</option><option>Tucuruvi</option><option>Vila Guilherme</option>
    <option>Parada Inglesa</option><option>Jardim São Paulo</option><option>Mandaqui</option>
    <option>Tremembé</option><option>Jaçanã</option><option>Casa Verde</option>
    <option>Freguesia do Ó</option><option>Brasilândia</option><option>Cachoeirinha</option>
    <option>Lauzane Paulista</option><option>Limão</option><option>Pirituba</option>
    <option>Jaraguá</option><option>São Domingos</option><option>Vila Maria</option>
    <option>Vila Medeiros</option><option>Imirim</option>
  </select>
  <textarea id="post-txt" placeholder="Mensagem do admin…"></textarea>
  <button onclick="postAdmin()">Publicar</button>
  <span id="post-msg"></span>
</div>

<!-- Messages by bairro -->
<div id="msgs-container"><div class="loading">Carregando…</div></div>

<!-- Users -->
<div class="users-card" id="users-card">
  <div class="card-head" onclick="toggleUsers()">
    <h4>👥 Usuários Registrados</h4>
    <span class="badge" id="users-badge">0 usuários</span>
  </div>
  <div class="users-body" id="users-body">
    <div class="loading">Carregando…</div>
  </div>
</div>

<script>
var OWNER='JsilvaM7', REPO='11hr', BRANCH='main', FILE='chat.json';
var RAW='https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/'+BRANCH+'/'+FILE;
var API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+FILE;
var BAIRROS=['Santana','Tucuruvi','Vila Guilherme','Parada Inglesa','Jardim São Paulo','Mandaqui','Tremembé','Jaçanã','Casa Verde','Freguesia do Ó','Brasilândia','Cachoeirinha','Lauzane Paulista','Limão','Pirituba','Jaraguá','São Domingos','Vila Maria','Vila Medeiros','Imirim'];

var chatData={mensagens:[],usuarios:{},config:{bairros:{},blocked:{}}};
var currentSha='';

function tok(){
  // Get token from parent frame (admin.html) or localStorage
  try{return window.parent.localStorage.getItem('11hr_tok')||localStorage.getItem('11hr_tok')||'';}catch(e){return localStorage.getItem('11hr_tok')||'';}
}
function safeH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(ts){if(!ts)return '';var d=new Date(ts);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function fmtPhone(p){var s=String(p||'');if(s.length===11)return '('+s.slice(0,2)+') '+s.slice(2,7)+'-'+s.slice(7);if(s.length===10)return '('+s.slice(0,2)+') '+s.slice(2,6)+'-'+s.slice(6);return s;}

async function loadData(){
  document.getElementById('msgs-container').innerHTML='<div class="loading">Carregando dados…</div>';
  try{
    var r=await fetch(RAW+'?v='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    chatData=await r.json();
    if(!chatData.config) chatData.config={bairros:{},blocked:{}};
    if(!chatData.config.blocked) chatData.config.blocked={};
    if(!chatData.mensagens) chatData.mensagens=[];
    if(!chatData.usuarios) chatData.usuarios={};

    // Get SHA
    if(tok()){
      try{
        var info=await fetch(API+'?ref='+BRANCH,{headers:{Authorization:'token '+tok()}});
        if(info.ok){var d=await info.json();currentSha=d.sha||'';}
      }catch(e){}
    }
    renderAll();
  }catch(e){
    document.getElementById('msgs-container').innerHTML='<div class="err">Erro ao carregar: '+safeH(e.message)+'</div>';
  }
}

function renderAll(){
  updateStats();
  applyFilter();
  renderUsers();
}

function updateStats(){
  var blocked=Object.keys(chatData.config.blocked||{}).filter(function(k){return chatData.config.blocked[k];});
  var activeBairros=BAIRROS.filter(function(b){return (chatData.mensagens||[]).some(function(m){return m.bairro===b;});});
  document.getElementById('st-msgs').textContent=chatData.mensagens.length;
  document.getElementById('st-users').textContent=Object.keys(chatData.usuarios).length;
  document.getElementById('st-blocked').textContent=blocked.length;
  document.getElementById('st-bairros').textContent=activeBairros.length;
}

function applyFilter(){
  var bairroF=document.getElementById('filter-bairro').value;
  var userF=(document.getElementById('filter-user').value||'').toLowerCase();
  var msgs=(chatData.mensagens||[]).filter(function(m){
    if(bairroF && m.bairro!==bairroF) return false;
    if(userF && !(m.autor||'').toLowerCase().includes(userF)) return false;
    return true;
  });
  renderMsgsTable(msgs, bairroF);
}

function renderMsgsTable(msgs, groupByBairro){
  var container=document.getElementById('msgs-container');
  if(!msgs.length){
    container.innerHTML='<div class="empty">Nenhuma mensagem encontrada.</div>';
    return;
  }

  if(!groupByBairro){
    // Group by bairro
    var byBairro={};
    msgs.forEach(function(m){
      var b=m.bairro||'?';
      if(!byBairro[b]) byBairro[b]=[];
      byBairro[b].push(m);
    });
    var html='';
    BAIRROS.concat(Object.keys(byBairro).filter(function(b){return !BAIRROS.includes(b);})).forEach(function(b){
      if(!byBairro[b]||!byBairro[b].length) return;
      html+=buildBairroCard(b, byBairro[b]);
    });
    container.innerHTML=html;
  } else {
    // Flat table for filtered view
    container.innerHTML='<div class="card"><div style="padding:0">'+buildTable(msgs)+'</div></div>';
  }
}

function buildBairroCard(bairro, msgs){
  var id='bc_'+bairro.replace(/\s/g,'_').replace(/[^a-z0-9_]/gi,'');
  return '<div class="card">'
    +'<div class="card-head" onclick="toggleCard(\''+id+'\')">'
    +'<h4>'+safeH(bairro)+'</h4>'
    +'<span class="badge">'+msgs.length+' mensagem'+(msgs.length!==1?'s':'')+'</span>'
    +'</div>'
    +'<div class="card-body" id="'+id+'">'+buildTable(msgs)+'</div>'
    +'</div>';
}

function buildTable(msgs){
  var rows=msgs.map(function(m,i){
    var user=chatData.usuarios[m.autor]||{};
    var phone=user.phone?fmtPhone(String(user.phone)):'—';
    var blocked=(chatData.config.blocked||{})[m.autor];
    var mIdx=chatData.mensagens.indexOf(m);
    return '<tr'+(blocked?' class="blocked-row"':'')+'>'
      +'<td class="td-user">'+safeH(m.autor)+(m.isAdmin?'<span class="tag-admin">ADMIN</span>':'')+(blocked?' 🚫':'')+'</td>'
      +'<td class="td-phone">'+safeH(phone)+'</td>'
      +'<td class="td-msg">'+safeH(m.texto)+'</td>'
      +'<td class="td-time">'+fmt(m.at)+'<br><span style="color:#aaa">'+safeH(m.bairro)+'</span></td>'
      +'<td class="td-actions">'
      +'<button class="btn-del" onclick="delMsg('+mIdx+')">🗑 Apagar</button>'
      +(blocked
        ?'<button class="unblock-btn" onclick="unblockUser(\''+safeH(m.autor)+'\')">✔ Desbloquear</button>'
        :'<button class="btn-block" onclick="blockUser(\''+safeH(m.autor)+'\')">🚫 Bloquear</button>'
      )
      +'</td>'
      +'</tr>';
  }).join('');
  return '<table>'
    +'<thead><tr><th>Usuário</th><th>Celular</th><th>Mensagem</th><th>Hora/Bairro</th><th>Ações</th></tr></thead>'
    +'<tbody>'+rows+'</tbody>'
    +'</table>';
}

function renderUsers(){
  var users=chatData.usuarios||{};
  var blocked=chatData.config.blocked||{};
  var keys=Object.keys(users);
  document.getElementById('users-badge').textContent=keys.length+' usuários';
  var rows=keys.map(function(k){
    var u=users[k];
    var phone=u.phone?fmtPhone(String(u.phone)):'—';
    var isBlocked=!!blocked[k];
    return '<tr'+(isBlocked?' class="blocked-row"':'')+'>'
      +'<td class="td-user">'+safeH(k)+(isBlocked?' 🚫':'')+'</td>'
      +'<td class="td-phone">'+safeH(phone)+'</td>'
      +'<td>'+safeH(u.bairro||'—')+'</td>'
      +'<td class="td-time">'+fmt(u.at)+'</td>'
      +'<td class="td-actions">'
      +(isBlocked
        ?'<button class="unblock-btn" onclick="unblockUser(\''+safeH(k)+'\')">✔ Desbloquear</button>'
        :'<button class="btn-block" onclick="blockUser(\''+safeH(k)+'\')">🚫 Bloquear</button>'
      )
      +'<button class="btn-del" onclick="deleteUser(\''+safeH(k)+'\')" style="margin-left:4px">🗑 Remover</button>'
      +'</td>'
      +'</tr>';
  }).join('');
  document.getElementById('users-body').innerHTML= keys.length
    ? '<table><thead><tr><th>Nome</th><th>Celular</th><th>Bairro</th><th>Cadastro</th><th>Ações</th></tr></thead><tbody>'+rows+'</tbody></table>'
    : '<div class="empty">Nenhum usuário ainda.</div>';
}

function toggleCard(id){var el=document.getElementById(id);if(el)el.classList.toggle('open');}
function toggleUsers(){document.getElementById('users-body').classList.toggle('open');}

/* ── Moderation actions ── */
function delMsg(idx){
  if(!confirm('Apagar esta mensagem?')) return;
  chatData.mensagens.splice(idx,1);
  save('Apagar mensagem').then(function(){renderAll();}).catch(alert);
}

function blockUser(username){
  if(!confirm('Bloquear "'+username+'"? Ele não poderá mais enviar mensagens.')) return;
  if(!chatData.config) chatData.config={bairros:{},blocked:{}};
  if(!chatData.config.blocked) chatData.config.blocked={};
  chatData.config.blocked[username]=true;
  save('Bloquear usuário '+username).then(function(){renderAll();}).catch(alert);
}

function unblockUser(username){
  if(!chatData.config||!chatData.config.blocked) return;
  delete chatData.config.blocked[username];
  save('Desbloquear usuário '+username).then(function(){renderAll();}).catch(alert);
}

function deleteUser(username){
  if(!confirm('Remover conta de "'+username+'" e todas as mensagens dele?')) return;
  delete chatData.usuarios[username];
  chatData.mensagens=chatData.mensagens.filter(function(m){return m.autor!==username;});
  if(chatData.config&&chatData.config.bairros){/* don't touch bairro counts */}
  save('Remover usuário '+username).then(function(){renderAll();}).catch(alert);
}

function postAdmin(){
  var bairro=document.getElementById('post-bairro').value;
  var txt=(document.getElementById('post-txt').value||'').trim();
  var msgEl=document.getElementById('post-msg');
  if(!bairro){alert('Selecione o bairro.');return;}
  if(!txt){alert('Digite a mensagem.');return;}
  msgEl.textContent='Publicando…';
  chatData.mensagens.push({
    id:Date.now()+'_admin',
    autor:'🛡️ Redação 11hr',
    bairro:bairro,
    texto:txt,
    at:new Date().toISOString(),
    isAdmin:true
  });
  save('Admin post em '+bairro).then(function(){
    document.getElementById('post-txt').value='';
    document.getElementById('post-bairro').value='';
    msgEl.style.color='#1a6b3a';
    msgEl.textContent='✔ Publicado!';
    setTimeout(function(){msgEl.textContent='';},3000);
    renderAll();
  }).catch(function(e){msgEl.style.color='#c62828';msgEl.textContent='Erro: '+e.message;});
}

/* ── GitHub save ── */
async function save(commitMsg){
  if(!tok()) throw new Error('Token não configurado. Faça login no admin.');
  // Refresh SHA
  try{
    var fresh=await fetch(API+'?ref='+BRANCH,{headers:{Authorization:'token '+tok()}});
    if(fresh.ok){var fd=await fresh.json();currentSha=fd.sha||'';}
  }catch(e){}
  var json=JSON.stringify(chatData,null,2);
  var b64=btoa(unescape(encodeURIComponent(json)));
  var body={message:'[admin] '+commitMsg,content:b64,branch:BRANCH};
  if(currentSha) body.sha=currentSha;
  var r=await fetch(API,{
    method:'PUT',
    headers:{Authorization:'token '+tok(),Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!r.ok){var e=await r.json().catch(function(){return {};});throw new Error(e.message||r.status);}
  var rd=await r.json();
  if(rd.content) currentSha=rd.content.sha||currentSha;
  return true;
}

// Auto-load
loadData();
</script>
</body>
</html>
